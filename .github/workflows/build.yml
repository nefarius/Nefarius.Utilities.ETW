name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          submodules: true
          lfs: true
          persist-credentials: false

      - name: Setup .Net SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.x

      - name: Build
        run: dotnet build -c Release

      - name: Test core library (net10.0)
        env:
          RUN_INTEGRATION_TESTS: "true"
          PARITY_OUTPUT_DIR: ${{ github.workspace }}/parity-json
        run: dotnet test tests -c Release --no-build -f net10.0 --logger "trx;LogFileName=test-results-core-net10.trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Test core library (net11.0)
        env:
          RUN_INTEGRATION_TESTS: "true"
        run: dotnet test tests -c Release --no-build -f net11.0 --logger "trx;LogFileName=test-results-core-net11.trx" --results-directory TestResults

      - name: Test OpenTelemetry integration (net10.0)
        run: dotnet test integrations/Nefarius.Utilities.ETW.OpenTelemetry.Tests -c Release --no-build -f net10.0 --logger "trx;LogFileName=test-results-otel-net10.trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Test relay CLI (net10.0)
        run: dotnet test tools/Nefarius.Utilities.ETW.Relay.CLI.Tests -c Release --no-build -f net10.0 --logger "trx;LogFileName=test-results-relay-net10.trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Test relay CLI (net11.0)
        run: dotnet test tools/Nefarius.Utilities.ETW.Relay.CLI.Tests -c Release --no-build -f net11.0 --logger "trx;LogFileName=test-results-relay-net11.trx" --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

      - name: Upload native vs managed JSON (candidate golden files)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: parity-json
          path: parity-json/*.json
          if-no-files-found: ignore

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: "TestResults/**/coverage.cobertura.xml"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          submodules: true
          lfs: true
          persist-credentials: false

      - name: Setup .Net SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.x

      - name: Build library and tests
        run: dotnet build tests -c Release

      - name: Test (managed backend, net10.0)
        run: dotnet test tests -c Release --no-build -f net10.0 --logger "trx;LogFileName=test-results-linux-net10.trx" --results-directory TestResults

      - name: Test (managed backend, net11.0)
        run: dotnet test tests -c Release --no-build -f net11.0 --logger "trx;LogFileName=test-results-linux-net11.trx" --results-directory TestResults

      - name: Build relay CLI tests
        run: dotnet build tools/Nefarius.Utilities.ETW.Relay.CLI.Tests -c Release

      - name: Test relay CLI (etwrelay pipeline without ETW, net10.0)
        run: dotnet test tools/Nefarius.Utilities.ETW.Relay.CLI.Tests -c Release --no-build -f net10.0 --logger "trx;LogFileName=test-results-relay-linux-net10.trx" --results-directory TestResults

      - name: Test relay CLI (etwrelay pipeline without ETW, net11.0)
        run: dotnet test tools/Nefarius.Utilities.ETW.Relay.CLI.Tests -c Release --no-build -f net11.0 --logger "trx;LogFileName=test-results-relay-linux-net11.trx" --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-linux
          path: "**/*.trx"
