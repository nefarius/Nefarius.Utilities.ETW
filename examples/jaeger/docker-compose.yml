# Example stack: capture client -> decoding gateway -> Aspire (logs) and Jaeger (traces)
#
#   docker compose -f examples/jaeger/docker-compose.yml up --build
#
# then open http://localhost:18888 for the decoded logs and
# http://localhost:16686 for the span view (service "relay-sample-sender").

services:
  aspire:
    # Standalone Aspire Dashboard: UI on 18888, OTLP/HTTP on 18890 (all interfaces).
    # Anonymous access is for this trusted local demo only.
    # Pin a specific version for anything beyond a demo.
    image: mcr.microsoft.com/aspire/dashboard:latest
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      # Host access stays on loopback. The gateway uses the Compose DNS name, not this mapping.
      - "127.0.0.1:18888:18888"

  jaeger:
    # Jaeger v2 all-in-one: OTLP receiver (4317/4318), in-memory storage, UI on 16686.
    # Pin a specific version for anything beyond a demo.
    image: jaegertracing/jaeger:latest
    ports:
      - "16686:16686"

  gateway:
    build:
      context: ../..
      dockerfile: examples/jaeger/gateway.Dockerfile
    environment:
      # Decoded events as native OTLP Logs. The gateway posts to {Endpoint}/v1/logs.
      Gateway__Export__Endpoint: http://aspire:18890
      # Jaeger stores traces only, so the gateway also exports every decoded event as a span.
      Gateway__Export__TracesEndpoint: http://jaeger:4318
      # Server-only WPP assets: put .pdb/.tmf files in ./wpp and uncomment the mount.
      Gateway__Wpp__PdbDirectories__0: /wpp
      Gateway__Wpp__TmfDirectories__0: /wpp
      # Optional: download PDBs for RSDS identities found in relayed events from this server.
      # Set it in your shell or an .env file, e.g. SYMBOL_SERVER_URL=https://msdl.microsoft.com/download/symbols
      # Empty (the default) disables discovery. Only this operator-set URL is ever contacted.
      Gateway__Wpp__SymbolServer: ${SYMBOL_SERVER_URL:-}
      Gateway__Wpp__SymbolCache: /symbols
    volumes:
      - symbols:/symbols
      # - ./wpp:/wpp:ro
    ports:
      # Host access stays on loopback. The sender uses the Compose DNS name, not this mapping.
      - "127.0.0.1:4318:4318"
    depends_on:
      - aspire
      - jaeger

  sender:
    # Stand-in for a native capture client: sends raw relay frames, holds no symbols.
    build:
      context: ../..
      dockerfile: examples/jaeger/sender.Dockerfile
    environment:
      GATEWAY_URL: http://gateway:4318
      INTERVAL_MS: "1000"
    depends_on:
      - gateway

volumes:
  # Persists downloaded PDBs across gateway restarts.
  symbols:
